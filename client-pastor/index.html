<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The VRT roundel, in the forms a browser actually asks for: favicon.ico
         holds the tab sizes (16/32/48) and is also what a browser requests
         unprompted, real launcher PNGs, and the 180px icon iOS wants for the
         home screen. All derived from vrt-logo.png by
         scripts/make-app-icons.js, so none of them can drift from the brand.
         The manifest link is injected by vite-plugin-pwa at build time. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#F6F2E9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Real-time attendance, offerings and emergency alerts for Victory Revival Temple's Reverend Pastor." />
    <title>VRT Pastor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
